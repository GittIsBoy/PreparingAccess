<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Judul Video Preview</title>
    <meta name="description" content="Deskripsi singkat video untuk preview di Facebook" />

    <!-- Facebook / Open Graph -->
    <!--
      IMPORTANT:
      - og:video harus menunjuk ke file video yang bisa diputar langsung (misalnya .mp4)
      - jangan pakai URL iframe/embed seperti https://streamable.com/e/1ilosz di og:video
      - URL embed itu untuk tampilan di halaman web, bukan untuk metadata video Facebook
    -->
    <meta property="og:type" content="video.other" />
    <meta property="og:title" content="Judul Video Preview" />
    <meta property="og:description" content="Deskripsi singkat video untuk preview di Facebook" />
    <meta property="og:url" content="https://yourdomain.com/video-page" />
    <meta property="og:image" content="https://yourdomain.com/thumbnail.jpg" />

    <meta property="og:video" content="https://yourdomain.com/video.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1280" />
    <meta property="og:video:height" content="720" />

    <!-- Twitter -->
    <meta name="twitter:card" content="player" />
    <meta name="twitter:title" content="Judul Video Preview" />
    <meta name="twitter:description" content="Deskripsi singkat video untuk preview di Facebook" />
    <meta name="twitter:image" content="https://yourdomain.com/thumbnail.jpg" />
    <meta name="twitter:player" content="https://yourdomain.com/video-page" />
    <meta name="twitter:player:width" content="1280" />
    <meta name="twitter:player:height" content="720" />
  </head>
  <body>
    <h1>Judul Video Preview</h1>
    <p>Ini contoh halaman yang bisa dipakai agar Facebook membaca preview video.</p>

    <div style="position: relative; width: 100%; height: 560px; max-width: 960px; margin: 20px auto;">
      <!--
        Ini untuk embed di halaman web. Ini BUKAN URL yang harus dipakai di og:video.
        Facebook tidak akan menganggap URL iframe sebagai file video yang bisa diputar.
      -->
      <iframe
        src="https://streamable.com/e/1ilosz"
        width="100%"
        height="100%"
        frameborder="0"
        allowfullscreen
        style="width:100%;height:100%;position:absolute;left:0;top:0;overflow:hidden;"
      ></iframe>
    </div>
  </body>
</html>
