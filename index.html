<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Judul Video Preview</title>
    <meta name="description" content="Deskripsi singkat video untuk preview di Facebook" />

    <!-- Facebook / Open Graph -->
    <!--
      IMPORTANT:
      - og:video harus menunjuk ke file video langsung (.mp4) yang bisa diputar publik
      - jangan pakai URL embed/iframe untuk og:video
      - URL halaman web yang dibagikan ke Facebook tetap harus halaman HTML, bukan file video
    -->
    <meta property="og:type" content="video.other" />
    <meta property="og:title" content="Judul Video Preview" />
    <meta property="og:description" content="Deskripsi singkat video untuk preview di Facebook" />
    <meta property="og:url" content="https://gittisboy.github.io/PreparingAccess/" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=1200&q=80" />

    <meta property="og:video" content="https://files.catbox.moe/5me8mz.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1280" />
    <meta property="og:video:height" content="720" />

    <!-- Twitter -->
    <meta name="twitter:card" content="player" />
    <meta name="twitter:title" content="Judul Video Preview" />
    <meta name="twitter:description" content="Deskripsi singkat video untuk preview di Facebook" />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=1200&q=80" />
    <meta name="twitter:player" content="https://gittisboy.github.io/PreparingAccess/" />
    <meta name="twitter:player:width" content="1280" />
    <meta name="twitter:player:height" content="720" />
  </head>
  <body>
    <h1>Judul Video Preview</h1>
    <p>Ini contoh halaman yang bisa dipakai agar Facebook membaca preview video.</p>

    <div style="position: relative; width: 100%; height: 560px; max-width: 960px; margin: 20px auto;">
      <!--
        Ini untuk embed di halaman web. Tidak harus sama dengan og:video.
        Facebook baca og:video untuk preview link, sedangkan iframe ini hanya untuk tampilan di halaman web.
      -->
      <video controls width="100%" height="100%" poster="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=1200&q=80">
        <source src="https://files.catbox.moe/5me8mz.mp4" type="video/mp4" />
        Browser kamu tidak mendukung video tag.
      </video>
    </div>
  </body>
</html>
